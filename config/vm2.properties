# VM2: combined KRaft controller + broker 1
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@10.113.232.128:9093

listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://10.113.232.128:9092
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

log.dirs=/home/shriram-chandrasekar/kafka-data

# topic defaults (topics are still created explicitly)
num.partitions=2
default.replication.factor=2
auto.create.topics.enable=false

# internal topics must survive VM3 going down
offsets.topic.replication.factor=2
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1
min.insync.replicas=1

# faster consumer startup
group.initial.rebalance.delay.ms=0
